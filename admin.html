<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sri Venkateshwara Parking — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#14161a; --panel:#1d2027; --panel-2:#252932;
    --hazard:#f4b400; --go:#2fb872; --stop:#e5484d;
    --text:#f2f0ea; --text-dim:#8b909c; --radius:12px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--ink);color:var(--text);font-family:'JetBrains Mono',monospace;}
  h1,h2,.display{font-family:'Oswald',sans-serif;}
  .wrap{max-width:900px;margin:0 auto;padding:24px 20px 60px;}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;
    border-bottom:3px solid transparent;
    border-image:repeating-linear-gradient(135deg,var(--hazard) 0 14px,var(--ink) 14px 28px) 3;
    padding-bottom:14px;}
  .topbar .title{font-size:24px;font-weight:600;}
  .card{background:var(--panel);border-radius:var(--radius);padding:20px;margin-bottom:20px;}
  .card h2{font-size:17px;margin:0 0 14px;font-weight:600;}
  label{font-size:12px;color:var(--text-dim);display:block;margin:0 0 4px;}
  input,select{width:100%;padding:9px 10px;border-radius:8px;border:1px solid #3a3f4a;
    background:var(--panel-2);color:var(--text);font-family:inherit;font-size:14px;margin-bottom:12px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;}
  .btn{padding:10px 18px;border-radius:8px;border:none;font-family:'Oswald',sans-serif;
    font-weight:600;font-size:14px;cursor:pointer;}
  .btn-go{background:var(--go);color:#04140c;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:var(--text-dim);font-weight:500;padding:8px;border-bottom:1px solid #33384280;font-size:11px;text-transform:uppercase;letter-spacing:0.4px;}
  td{padding:8px;border-bottom:1px solid #33384280;vertical-align:middle;}
  .pill{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;}
  .pill.ok{background:rgba(47,184,114,.15);color:var(--go);}
  .pill.bad{background:rgba(229,72,77,.15);color:var(--stop);}
  .qrlink{color:var(--hazard);text-decoration:none;font-size:12px;}
  .err{color:var(--stop);font-size:13px;}
  .login{max-width:300px;margin:80px auto;display:flex;flex-direction:column;gap:10px;}
  .hidden{display:none!important;}
</style>
</head>
<body>
<div class="wrap">

  <div class="login" id="loginView">
    <h2 class="display">Admin sign-in</h2>
    <input type="email" id="email" placeholder="email">
    <input type="password" id="password" placeholder="password">
    <button class="btn btn-go" id="loginBtn">Sign in</button>
    <div class="err" id="loginErr"></div>
  </div>

  <div id="mainView" class="hidden">
    <div class="topbar">
      <div>
        <div class="title" id="facilityTitle">SRI VENKATESHWARA PARKING</div>
        <div style="font-size:11px;color:var(--text-dim);margin-top:2px;">Admin</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;">
        <a href="#" id="gateLink" style="font-size:12px;color:var(--text-dim);border:1px solid #3a3f4a;padding:8px 12px;border-radius:8px;text-decoration:none;">← Gate</a>
        <button class="btn" id="signout" style="background:none;border:1px solid #3a3f4a;color:var(--text-dim);">Sign out</button>
      </div>
    </div>

    <div class="card" style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;text-align:center;">
      <div>
        <div style="font-family:'Oswald',sans-serif;font-size:28px;font-weight:600;" id="statCheckedIn">–</div>
        <div style="font-size:11px;color:var(--text-dim);text-transform:uppercase;">Checked in today</div>
      </div>
      <div>
        <div style="font-family:'Oswald',sans-serif;font-size:28px;font-weight:600;color:var(--go);" id="statPresent">–</div>
        <div style="font-size:11px;color:var(--text-dim);text-transform:uppercase;">Present now</div>
      </div>
      <div>
        <div style="font-family:'Oswald',sans-serif;font-size:28px;font-weight:600;color:var(--hazard);" id="statAmount">–</div>
        <div style="font-size:11px;color:var(--text-dim);text-transform:uppercase;">Collected today</div>
      </div>
    </div>

    <div class="card">
      <h2>Reports</h2>
      <div class="grid2" style="align-items:end;">
        <label>View a specific day this month</label>
        <label>View a whole month</label>
        <input type="date" id="reportDate">
        <input type="month" id="reportMonth">
        <button class="btn" id="viewDayBtn" style="background:none;border:1px solid #3a3f4a;color:var(--text);width:100%;margin-bottom:12px;">View day</button>
        <button class="btn" id="viewMonthBtn" style="background:none;border:1px solid #3a3f4a;color:var(--text);width:100%;margin-bottom:12px;">View month</button>
      </div>
      <div id="reportResult" style="display:none;padding-top:8px;border-top:1px solid #33384280;">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;text-align:center;margin-bottom:12px;">
          <div>
            <div style="font-family:'Oswald',sans-serif;font-size:24px;font-weight:600;" id="reportCount">–</div>
            <div style="font-size:11px;color:var(--text-dim);text-transform:uppercase;">Checked in</div>
          </div>
          <div>
            <div style="font-family:'Oswald',sans-serif;font-size:24px;font-weight:600;color:var(--hazard);" id="reportAmount">–</div>
            <div style="font-size:11px;color:var(--text-dim);text-transform:uppercase;">Collected</div>
          </div>
        </div>
        <button class="btn" id="exportCsvBtn" style="background:none;border:1px solid #3a3f4a;color:var(--text);width:100%;">Export CSV</button>
      </div>
    </div>

    <div class="card">
      <h2>Who's on duty today</h2>
      <div id="dutyList" style="font-size:13px;color:var(--text-dim);">Loading…</div>
    </div>

    <div class="card">
      <h2 id="addCardTitle">Add member</h2>
      <div class="grid2">
        <div><label>Name</label><input id="f_name"></div>
        <div><label>Phone</label><input id="f_phone"></div>
        <div><label>Vehicle number</label><input id="f_vehicle"></div>
        <div>
          <label>Plan type</label>
          <select id="f_plan">
            <option value="monthly">Monthly pass</option>
            <option value="per_visit">Pay-per-visit</option>
          </select>
        </div>
        <div id="monthlyFields">
          <label>Monthly fee (₹)</label><input id="f_fee" type="number">
        </div>
        <div id="perVisitFields" style="display:none;">
          <label>Per-visit rate (₹)</label><input id="f_rate" type="number">
        </div>
      </div>
      <div style="display:flex;gap:10px;">
        <button class="btn btn-go" id="addBtn" style="flex:1;">Add member</button>
        <button class="btn hidden" id="cancelEditBtn" style="background:none;border:1px solid #3a3f4a;color:var(--text-dim);">Cancel</button>
      </div>
      <div class="err" id="addErr"></div>
    </div>

    <div class="card">
      <h2>Members</h2>
      <input id="memberSearch" placeholder="Search by name, vehicle, or card code…" style="margin-bottom:14px;">
      <table>
        <thead>
          <tr><th>Name</th><th>Vehicle</th><th>Plan</th><th>Status</th><th>QR</th><th>Actions</th></tr>
        </thead>
        <tbody id="memberRows"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://zrmpphpdfiaznxrqhxdi.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpybXBwaHBkZmlhem54cnFoeGRpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1NTE1MDIsImV4cCI6MjEwMTEyNzUwMn0.V6K4lOvD_-K7C0jBytUBDbNdVf5aZXKDgnlybNywV94';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ---- FACILITY RESOLUTION (which parking lot this admin link belongs to) ----
const urlParams = new URLSearchParams(window.location.search);
const FACILITY_SLUG = urlParams.get('facility');
let FACILITY_ID = null;

async function resolveFacility(){
  if (!FACILITY_SLUG){
    document.body.innerHTML = '<div style="padding:60px 24px;text-align:center;color:#f2f0ea;font-family:sans-serif;">This link is missing a facility. Use the correct admin link for this lot, e.g. admin.html?facility=lot-a</div>';
    throw new Error('no facility slug in URL');
  }
  const { data, error } = await sb.from('facilities').select('*').eq('slug', FACILITY_SLUG).eq('is_active', true).maybeSingle();
  if (error || !data){
    document.body.innerHTML = '<div style="padding:60px 24px;text-align:center;color:#f2f0ea;font-family:sans-serif;">Invalid or inactive facility link.</div>';
    throw new Error('facility not found: ' + FACILITY_SLUG);
  }
  FACILITY_ID = data.id;
  document.getElementById('facilityTitle').textContent = data.name;
  document.title = data.name + ' — Admin';
  document.getElementById('gateLink').href = `/guard.html?facility=${encodeURIComponent(FACILITY_SLUG)}`;
}

const loginView = document.getElementById('loginView');
const mainView = document.getElementById('mainView');

document.getElementById('loginBtn').onclick = async () => {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errBox = document.getElementById('loginErr');
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { errBox.textContent = error.message; return; }
  boot();
};
document.getElementById('signout').onclick = async () => { await sb.auth.signOut(); location.reload(); };

document.getElementById('f_plan').onchange = (e) => {
  document.getElementById('monthlyFields').style.display = e.target.value === 'monthly' ? 'block' : 'none';
  document.getElementById('perVisitFields').style.display = e.target.value === 'per_visit' ? 'block' : 'none';
};

async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session){ return; }
  loginView.classList.add('hidden');
  mainView.classList.remove('hidden');
  loadMembers();
  loadStats();
  loadDutyList();
}

async function loadDutyList(){
  const startOfDay = new Date(); startOfDay.setHours(0,0,0,0);
  const { data: sessions } = await sb.from('parking_sessions').select('guard_notes').eq('facility_id', FACILITY_ID).gte('checked_in_at', startOfDay.toISOString());
  const { data: recharges } = await sb.from('recharges').select('guard_notes').eq('facility_id', FACILITY_ID).gte('recharged_at', startOfDay.toISOString());

  const counts = {};
  [...(sessions || []), ...(recharges || [])].forEach(row => {
    const match = (row.guard_notes || '').match(/by (.+)$/);
    if (match){
      const name = match[1].trim();
      counts[name] = (counts[name] || 0) + 1;
    }
  });

  const names = Object.keys(counts);
  const dutyList = document.getElementById('dutyList');
  if (names.length === 0){
    dutyList.textContent = 'No activity yet today.';
    return;
  }
  dutyList.innerHTML = names.map(n => `<div style="display:flex;justify-content:space-between;padding:4px 0;"><span style="color:var(--text);">${escapeHtml(n)}</span><span>${counts[n]} action${counts[n] !== 1 ? 's' : ''}</span></div>`).join('');
}

let lastReportRange = null;

document.getElementById('viewDayBtn').onclick = async () => {
  const dateVal = document.getElementById('reportDate').value;
  if (!dateVal) return;
  const start = new Date(dateVal + 'T00:00:00');
  const end = new Date(dateVal + 'T23:59:59');
  await runReport(start, end);
};

document.getElementById('viewMonthBtn').onclick = async () => {
  const monthVal = document.getElementById('reportMonth').value; // "YYYY-MM"
  if (!monthVal) return;
  const [y, m] = monthVal.split('-').map(Number);
  const start = new Date(y, m - 1, 1, 0, 0, 0);
  const end = new Date(y, m, 0, 23, 59, 59); // last day of month
  await runReport(start, end);
};

async function runReport(start, end){
  lastReportRange = { start, end };
  const { count } = await sb.from('parking_sessions')
    .select('id', { count: 'exact', head: true })
    .eq('facility_id', FACILITY_ID)
    .gte('checked_in_at', start.toISOString())
    .lte('checked_in_at', end.toISOString());

  const { data: sessions } = await sb.from('parking_sessions')
    .select('amount_collected')
    .eq('facility_id', FACILITY_ID)
    .gte('checked_in_at', start.toISOString())
    .lte('checked_in_at', end.toISOString());
  const sessionTotal = (sessions || []).reduce((sum, s) => sum + (s.amount_collected || 0), 0);

  const { data: recharges } = await sb.from('recharges')
    .select('amount')
    .eq('facility_id', FACILITY_ID)
    .gte('recharged_at', start.toISOString())
    .lte('recharged_at', end.toISOString());
  const rechargeTotal = (recharges || []).reduce((sum, r) => sum + (r.amount || 0), 0);

  document.getElementById('reportCount').textContent = count ?? '0';
  document.getElementById('reportAmount').textContent = `₹${sessionTotal + rechargeTotal}`;
  document.getElementById('reportResult').style.display = 'block';
}

document.getElementById('exportCsvBtn').onclick = async () => {
  if (!lastReportRange) return;
  const { start, end } = lastReportRange;

  const { data: sessions } = await sb.from('parking_sessions')
    .select('*, members(name, plan_type)')
    .eq('facility_id', FACILITY_ID)
    .gte('checked_in_at', start.toISOString())
    .lte('checked_in_at', end.toISOString())
    .order('checked_in_at');

  const rows = [['Type','Name','Vehicle','Checked In','Checked Out','Amount','Payment Mode','Notes']];
  (sessions || []).forEach(s => {
    rows.push([
      s.members?.plan_type || '', s.members?.name || '', s.vehicle_number || '',
      s.checked_in_at || '', s.checked_out_at || '', s.amount_collected || '',
      s.payment_mode || '', s.guard_notes || ''
    ]);
  });

  const { data: recharges } = await sb.from('recharges')
    .select('*, members(name)')
    .eq('facility_id', FACILITY_ID)
    .gte('recharged_at', start.toISOString())
    .lte('recharged_at', end.toISOString())
    .order('recharged_at');
  (recharges || []).forEach(r => {
    rows.push(['recharge', r.members?.name || '', '', r.recharged_at || '', '', r.amount || '', '', r.guard_notes || '']);
  });

  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `parking-report-${start.toISOString().slice(0,10)}-to-${end.toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
};

async function loadStats(){
  const startOfDay = new Date(); startOfDay.setHours(0,0,0,0);

  const { count: checkedIn } = await sb.from('parking_sessions')
    .select('id', { count: 'exact', head: true })
    .eq('facility_id', FACILITY_ID)
    .gte('checked_in_at', startOfDay.toISOString());

  const { count: present } = await sb.from('parking_sessions')
    .select('id', { count: 'exact', head: true })
    .eq('facility_id', FACILITY_ID)
    .is('checked_out_at', null);

  const { data: todaySessions } = await sb.from('parking_sessions')
    .select('amount_collected')
    .eq('facility_id', FACILITY_ID)
    .gte('checked_in_at', startOfDay.toISOString());
  const sessionAmount = (todaySessions || []).reduce((sum, s) => sum + (s.amount_collected || 0), 0);

  const { data: todayRecharges } = await sb.from('recharges')
    .select('amount')
    .eq('facility_id', FACILITY_ID)
    .gte('recharged_at', startOfDay.toISOString());
  const rechargeAmount = (todayRecharges || []).reduce((sum, r) => sum + (r.amount || 0), 0);

  const totalAmount = sessionAmount + rechargeAmount;

  document.getElementById('statCheckedIn').textContent = checkedIn ?? '0';
  document.getElementById('statPresent').textContent = present ?? '0';
  document.getElementById('statAmount').textContent = `₹${totalAmount}`;
}

let editingMemberId = null;
let allMembers = [];

document.getElementById('addBtn').onclick = async () => {
  const errBox = document.getElementById('addErr');
  errBox.textContent = '';
  const plan = document.getElementById('f_plan').value;
  const payload = {
    name: document.getElementById('f_name').value.trim(),
    phone: document.getElementById('f_phone').value.trim(),
    vehicle_number: document.getElementById('f_vehicle').value.trim(),
    plan_type: plan,
    monthly_fee: plan === 'monthly' ? parseFloat(document.getElementById('f_fee').value) || null : null,
    per_visit_rate: plan === 'per_visit' ? parseFloat(document.getElementById('f_rate').value) || null : null,
    facility_id: FACILITY_ID
  };
  if (!payload.name || !payload.phone || !payload.vehicle_number){
    errBox.textContent = 'Name, phone and vehicle number are required.';
    return;
  }

  if (editingMemberId){
    const { error } = await sb.from('members').update(payload).eq('id', editingMemberId);
    if (error){ errBox.textContent = error.message; return; }
    exitEditMode();
  } else {
    payload.valid_until = null; // no payment recorded yet — guard must recharge to activate
    payload.payment_status = plan === 'monthly' ? 'lapsed' : null;
    const { error } = await sb.from('members').insert(payload);
    if (error){ errBox.textContent = error.message; return; }
  }
  ['f_name','f_phone','f_vehicle','f_fee','f_rate'].forEach(id => document.getElementById(id).value = '');
  loadMembers();
};

document.getElementById('cancelEditBtn').onclick = exitEditMode;

function exitEditMode(){
  editingMemberId = null;
  document.getElementById('addCardTitle').textContent = 'Add member';
  document.getElementById('addBtn').textContent = 'Add member';
  document.getElementById('cancelEditBtn').classList.add('hidden');
  ['f_name','f_phone','f_vehicle','f_fee','f_rate'].forEach(id => document.getElementById(id).value = '');
}

function enterEditMode(member){
  editingMemberId = member.id;
  document.getElementById('addCardTitle').textContent = `Editing: ${member.name}`;
  document.getElementById('addBtn').textContent = 'Save changes';
  document.getElementById('cancelEditBtn').classList.remove('hidden');
  document.getElementById('f_name').value = member.name || '';
  document.getElementById('f_phone').value = member.phone || '';
  document.getElementById('f_vehicle').value = member.vehicle_number || '';
  document.getElementById('f_plan').value = member.plan_type;
  document.getElementById('f_fee').value = member.monthly_fee || '';
  document.getElementById('f_rate').value = member.per_visit_rate || '';
  document.getElementById('f_plan').dispatchEvent(new Event('change'));
  document.getElementById('addCardTitle').scrollIntoView({ behavior: 'smooth' });
}

function oneMonthFromNow(){
  const d = new Date(); d.setMonth(d.getMonth() + 1);
  return d.toISOString().slice(0,10);
}

document.getElementById('memberSearch').oninput = (e) => renderMembers(e.target.value.trim().toLowerCase());

async function loadMembers(){
  const { data: members, error } = await sb.from('members').select('*').eq('facility_id', FACILITY_ID).order('created_at', { ascending: false });
  if (error){ document.getElementById('memberRows').innerHTML = `<tr><td colspan="6">Error loading members</td></tr>`; return; }
  allMembers = members || [];
  renderMembers(document.getElementById('memberSearch').value.trim().toLowerCase());
}

function renderMembers(filter){
  const tbody = document.getElementById('memberRows');
  tbody.innerHTML = '';

  const filtered = !filter ? allMembers : allMembers.filter(m =>
    (m.name || '').toLowerCase().includes(filter) ||
    (m.vehicle_number || '').toLowerCase().includes(filter) ||
    (m.card_code || '').toLowerCase().includes(filter)
  );

  if (filtered.length === 0){
    tbody.innerHTML = `<tr><td colspan="6" style="color:var(--text-dim);">No members match.</td></tr>`;
    return;
  }

  filtered.forEach(m => {
    const lapsed = m.plan_type === 'monthly' && (m.payment_status === 'lapsed' || (m.valid_until && new Date(m.valid_until) < new Date()));
    const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(m.id)}`;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${escapeHtml(m.name)}</td>
      <td>${escapeHtml(m.vehicle_number || '—')}</td>
      <td>${m.plan_type === 'monthly' ? 'Monthly' : 'Per-visit'}</td>
      <td>${!m.is_active ? '<span class="pill bad">Deactivated</span>' : lapsed ? '<span class="pill bad">Lapsed</span>' : '<span class="pill ok">Active</span>'}</td>
      <td><a class="qrlink" href="${qrUrl}" target="_blank">View QR</a></td>
      <td style="white-space:nowrap;">
        ${m.plan_type === 'monthly' ? `<button class="btn" data-id="${m.id}" data-action="renew" style="background:none;border:1px solid #3a3f4a;color:var(--text-dim);padding:5px 10px;font-size:12px;margin-right:6px;">Renew</button>` : ''}
        <button class="btn" data-action="edit" style="background:none;border:1px solid #3a3f4a;color:var(--text-dim);padding:5px 10px;font-size:12px;margin-right:6px;">Edit</button>
        <button class="btn" data-id="${m.id}" data-action="replace-card" style="background:none;border:1px solid var(--hazard);color:var(--hazard);padding:5px 10px;font-size:12px;margin-right:6px;">Replace card</button>
        <button class="btn" data-id="${m.id}" data-name="${escapeHtml(m.name)}" data-action="delete" style="background:none;border:1px solid var(--stop);color:var(--stop);padding:5px 10px;font-size:12px;">Delete</button>
      </td>
    `;
    tr.querySelector('[data-action="edit"]').onclick = () => enterEditMode(m);
    tbody.appendChild(tr);
  });

  tbody.querySelectorAll('[data-action="renew"]').forEach(btn => {
    btn.onclick = async () => {
      const { error } = await sb.from('members').update({ valid_until: oneMonthFromNow(), payment_status: 'active' }).eq('id', btn.dataset.id);
      if (error){ alert('Could not renew — check your connection and try again.'); return; }
      loadMembers();
    };
  });

  tbody.querySelectorAll('[data-action="replace-card"]').forEach(btn => {
    btn.onclick = async () => {
      const newCode = prompt("Scan or read the new physical card, then type exactly what it decodes to:");
      if (!newCode) return;
      const { error } = await sb.from('members').update({ card_code: newCode.trim() }).eq('id', btn.dataset.id);
      if (error){ alert('Could not save — that code may already be in use on another card.'); return; }
      alert('Card replaced. The old card no longer works for this member.');
      loadMembers();
    };
  });

  tbody.querySelectorAll('[data-action="delete"]').forEach(btn => {
    btn.onclick = async () => {
      if (!confirm(`Delete ${btn.dataset.name}? This can't be undone.`)) return;
      const { error } = await sb.from('members').delete().eq('id', btn.dataset.id);
      if (error){
        await sb.from('members').update({ is_active: false }).eq('id', btn.dataset.id);
        alert(`${btn.dataset.name} has parking history, so they were deactivated instead of deleted (history is kept intact).`);
      }
      loadMembers();
    };
  });
}

function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

resolveFacility().then(boot).catch(() => {});
</script>
</body>
</html>
