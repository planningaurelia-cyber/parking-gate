<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gate — Parking Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --ink:#14161a;
    --panel:#1d2027;
    --panel-2:#252932;
    --hazard:#f4b400;
    --go:#2fb872;
    --stop:#e5484d;
    --text:#f2f0ea;
    --text-dim:#8b909c;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;height:100%;
    background:var(--ink);
    color:var(--text);
    font-family:'JetBrains Mono',monospace;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;
  }
  h1,h2,.display{font-family:'Oswald',sans-serif;}

  .app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;}

  /* Top bar with hazard stripe */
  .topbar{
    position:relative;
    padding:18px 20px 16px;
    background:var(--panel);
    border-bottom:3px solid transparent;
    border-image:repeating-linear-gradient(135deg,var(--hazard) 0 14px,var(--ink) 14px 28px) 3;
    display:flex;align-items:center;justify-content:space-between;
  }
  .topbar .title{font-size:20px;font-weight:600;letter-spacing:0.5px;}
  .topbar .sub{color:var(--text-dim);font-size:12px;margin-top:2px;}
  #signout{
    background:none;border:1px solid #3a3f4a;color:var(--text-dim);
    font-family:inherit;font-size:11px;padding:6px 10px;border-radius:8px;cursor:pointer;
  }

  /* Scanner viewport */
  .scan-wrap{
    position:relative;
    margin:20px 20px 0;
    border-radius:var(--radius);
    overflow:hidden;
    background:#000;
    aspect-ratio:1/1;
  }
  #reader{width:100%;height:100%;}
  #reader video{object-fit:cover;width:100%!important;height:100%!important;}

  /* Boom barrier — the signature element */
  .barrier-stage{
    position:relative;
    margin:22px 20px 0;
    height:120px;
    background:var(--panel);
    border-radius:var(--radius);
    overflow:hidden;
    display:flex;align-items:flex-end;justify-content:center;
    padding-bottom:14px;
  }
  .barrier-post{
    position:absolute;bottom:0;left:50%;transform:translateX(-50%);
    width:14px;height:60px;background:var(--panel-2);border-radius:4px 4px 0 0;
  }
  .barrier-arm{
    position:absolute;
    bottom:56px;left:50%;
    width:150px;height:14px;
    transform-origin:8px center;
    transform:translateX(-8px) rotate(0deg);
    border-radius:6px;
    background:repeating-linear-gradient(90deg,var(--hazard) 0 18px,var(--ink) 18px 24px);
    transition:transform .55s cubic-bezier(.34,1.56,.64,1);
    box-shadow:0 2px 8px rgba(0,0,0,.4);
  }
  .barrier-stage.open .barrier-arm{transform:translateX(-8px) rotate(-78deg);}
  .barrier-stage.stop .barrier-arm{transform:translateX(-8px) rotate(0deg);}

  .status-caption{
    text-align:center;font-family:'Oswald',sans-serif;font-size:15px;
    color:var(--text-dim);padding:14px 20px 0;letter-spacing:0.3px;
  }

  /* Result card */
  .result{
    margin:16px 20px 20px;
    background:var(--panel);
    border-radius:var(--radius);
    padding:18px;
    display:none;
  }
  .result.show{display:block;animation:rise .25s ease;}
  @keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .result .name{font-family:'Oswald',sans-serif;font-size:22px;font-weight:600;}
  .result .meta{color:var(--text-dim);font-size:13px;margin-top:2px;}
  .flag{
    display:inline-block;margin-top:10px;padding:4px 10px;border-radius:20px;
    font-size:11px;font-weight:600;letter-spacing:0.4px;text-transform:uppercase;
  }
  .flag.ok{background:rgba(47,184,114,.15);color:var(--go);}
  .flag.bad{background:rgba(229,72,77,.15);color:var(--stop);}

  .checkout-form{margin-top:14px;padding-top:14px;border-top:1px solid #33384280;}
  .checkout-form label{font-size:12px;color:var(--text-dim);display:block;margin-bottom:6px;}
  .checkout-form input, .checkout-form select{
    width:100%;padding:10px 12px;border-radius:8px;border:1px solid #3a3f4a;
    background:var(--panel-2);color:var(--text);font-family:inherit;font-size:15px;margin-bottom:10px;
  }
  .btn{
    width:100%;padding:13px;border-radius:10px;border:none;font-family:'Oswald',sans-serif;
    font-size:15px;font-weight:600;letter-spacing:0.3px;cursor:pointer;
  }
  .btn-go{background:var(--go);color:#04140c;}
  .btn-stop{background:var(--stop);color:#1a0505;}

  .rescan{margin-top:10px;background:none;border:1px solid #3a3f4a;color:var(--text-dim);}

  /* Login screen */
  .login{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:12px;}
  .login input{width:100%;max-width:280px;padding:12px;border-radius:8px;border:1px solid #3a3f4a;background:var(--panel);color:var(--text);font-family:inherit;}
  .login button{width:100%;max-width:280px;}
  .err{color:var(--stop);font-size:13px;text-align:center;}
  .hidden{display:none!important;}
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div>
      <div class="title">GATE</div>
      <div class="sub" id="guardLabel">Parking Control</div>
    </div>
    <button id="signout" class="hidden">Sign out</button>
  </div>

  <!-- NAME PROMPT (no login, just identifies who's on duty) -->
  <div class="login" id="loginView">
    <h2 class="display" style="margin:0 0 6px;">Who's on duty?</h2>
    <input type="text" id="guardName" placeholder="Your name">
    <button class="btn btn-go" id="startBtn">Start scanning</button>
  </div>

  <!-- MAIN APP -->
  <div id="mainView" class="hidden" style="flex:1;display:flex;flex-direction:column;">
    <div class="scan-wrap">
      <div id="reader"></div>
    </div>

    <div class="barrier-stage" id="barrierStage">
      <div class="barrier-post"></div>
      <div class="barrier-arm" id="barrierArm"></div>
    </div>
    <div class="status-caption" id="caption">Point camera at member's QR</div>

    <div class="result" id="resultCard"></div>
  </div>

</div>

<script>
// ---------------------------------------------------------------
// CONFIG — fill these in with your Supabase project details
// ---------------------------------------------------------------
const SUPABASE_URL = 'https://YOUR_PROJECT.supabase.co';
const SUPABASE_ANON_KEY = 'YOUR_ANON_KEY';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const loginView = document.getElementById('loginView');
const mainView = document.getElementById('mainView');
const guardLabel = document.getElementById('guardLabel');
const signoutBtn = document.getElementById('signout');
const caption = document.getElementById('caption');
const resultCard = document.getElementById('resultCard');
const barrierStage = document.getElementById('barrierStage');

let html5QrCode;
let scanning = false;
let busy = false; // prevents double-processing the same scan
let currentGuardName = '';

// ---------------- NAME PROMPT (no login) ----------------
document.getElementById('startBtn').onclick = () => {
  const name = document.getElementById('guardName').value.trim();
  if (!name) return;
  currentGuardName = name;
  localStorage.setItem('guardName', name);
  boot();
};

signoutBtn.onclick = () => {
  localStorage.removeItem('guardName');
  location.reload();
};

function boot(){
  const savedName = localStorage.getItem('guardName');
  if (!savedName && !currentGuardName){
    loginView.classList.remove('hidden');
    mainView.classList.add('hidden');
    return;
  }
  currentGuardName = currentGuardName || savedName;
  guardLabel.textContent = `${currentGuardName} · on duty`;

  loginView.classList.add('hidden');
  mainView.classList.remove('hidden');
  signoutBtn.classList.remove('hidden');
  startScanner();
}

// ---------------- SCANNER ----------------
function startScanner(){
  if (scanning) return;
  html5QrCode = new Html5Qrcode('reader');
  html5QrCode.start(
    { facingMode: 'environment' },
    { fps: 10, qrbox: { width: 240, height: 240 } },
    onScan,
    () => {}
  ).then(() => scanning = true);
}

function pauseScanner(){
  if (scanning && html5QrCode){ html5QrCode.pause(true); }
}
function resumeScanner(){
  if (scanning && html5QrCode){ html5QrCode.resume(); }
}

async function onScan(memberId){
  if (busy) return;
  busy = true;
  pauseScanner();
  await handleMember(memberId.trim());
}

// ---------------- CORE LOGIC ----------------
async function handleMember(memberId){
  caption.textContent = 'Looking up member…';

  const { data: member, error } = await sb.from('members').select('*').eq('id', memberId).single();
  if (error || !member){
    flashBarrier('stop');
    showResult({ name: 'Unrecognized QR', meta: 'This code does not match any member.', flagBad: true });
    return;
  }

  if (!member.is_active){
    flashBarrier('stop');
    showResult({ name: member.name, meta: 'Membership deactivated', flagBad: true });
    return;
  }

  // Is there an open session for this member?
  const { data: openSession } = await sb.from('parking_sessions')
    .select('*').eq('member_id', member.id).is('checked_out_at', null)
    .maybeSingle();

  if (openSession){
    // ---- CHECKOUT ----
    if (member.plan_type === 'per_visit'){
      showCheckoutForm(member, openSession);
    } else {
      await closeSession(openSession.id, {});
      flashBarrier('go');
      showResult({ name: member.name, meta: `Checked out · ${formatDuration(openSession.checked_in_at)}` });
    }
  } else {
    // ---- CHECK-IN ----
    let flagBad = false, note = '';
    if (member.plan_type === 'monthly'){
      const lapsed = member.payment_status === 'lapsed' ||
                     (member.valid_until && new Date(member.valid_until) < new Date());
      if (lapsed){ flagBad = true; note = 'Payment lapsed / plan expired'; }
    }

    const { error: insErr } = await sb.from('parking_sessions').insert({
      member_id: member.id,
      amount_due: member.plan_type === 'per_visit' ? member.per_visit_rate : null,
      guard_notes: `Checked in by ${currentGuardName}`
    });

    if (insErr){
      flashBarrier('stop');
      showResult({ name: member.name, meta: 'Could not open session — try again', flagBad: true });
      return;
    }

    flashBarrier(flagBad ? 'stop' : 'go');
    showResult({
      name: member.name,
      meta: `Checked in · ${member.vehicle_number} · ${member.plan_type === 'monthly' ? 'Monthly pass' : 'Pay-per-visit'}`,
      flagBad,
      badNote: note
    });
  }
}

async function closeSession(sessionId, extra){
  await sb.from('parking_sessions').update({
    checked_out_at: new Date().toISOString(),
    guard_notes: `Checked out by ${currentGuardName}`,
    ...extra
  }).eq('id', sessionId);
}

function formatDuration(startIso){
  const mins = Math.round((Date.now() - new Date(startIso).getTime()) / 60000);
  const h = Math.floor(mins/60), m = mins%60;
  return h > 0 ? `${h}h ${m}m` : `${m}m`;
}

// ---------------- UI HELPERS ----------------
function flashBarrier(state){
  barrierStage.classList.remove('open','stop');
  if (state === 'go'){
    barrierStage.classList.add('open');
    caption.textContent = 'Entry clear';
    setTimeout(() => barrierStage.classList.remove('open'), 2200);
  } else {
    barrierStage.classList.add('stop');
    caption.textContent = 'Flagged — guard review';
  }
}

function showResult({ name, meta, flagBad, badNote }){
  resultCard.innerHTML = `
    <div class="name">${escapeHtml(name)}</div>
    <div class="meta">${escapeHtml(meta)}</div>
    ${flagBad ? `<span class="flag bad">${escapeHtml(badNote || 'Needs attention')}</span>` : `<span class="flag ok">Clear</span>`}
    <button class="btn rescan" style="margin-top:14px;" onclick="reset()">Scan next</button>
  `;
  resultCard.classList.add('show');
}

function showCheckoutForm(member, session){
  caption.textContent = 'Collect payment to check out';
  resultCard.innerHTML = `
    <div class="name">${escapeHtml(member.name)}</div>
    <div class="meta">${member.vehicle_number} · in for ${formatDuration(session.checked_in_at)}</div>
    <div class="checkout-form">
      <label>Amount collected (₹)</label>
      <input type="number" id="amtInput" value="${member.per_visit_rate || ''}" inputmode="numeric">
      <label>Payment mode</label>
      <select id="modeInput">
        <option value="upi">UPI</option>
        <option value="cash">Cash</option>
      </select>
      <button class="btn btn-stop" id="confirmCheckout">Confirm checkout</button>
    </div>
  `;
  resultCard.classList.add('show');

  document.getElementById('confirmCheckout').onclick = async () => {
    const amount = parseFloat(document.getElementById('amtInput').value) || 0;
    const mode = document.getElementById('modeInput').value;
    await closeSession(session.id, { amount_collected: amount, payment_mode: mode });
    flashBarrier('go');
    showResult({ name: member.name, meta: `Checked out · ₹${amount} via ${mode}` });
  };
}

function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

window.reset = function(){
  resultCard.classList.remove('show');
  resultCard.innerHTML = '';
  barrierStage.classList.remove('open','stop');
  caption.textContent = "Point camera at member's QR";
  busy = false;
  resumeScanner();
};

boot();
</script>
</body>
</html>
